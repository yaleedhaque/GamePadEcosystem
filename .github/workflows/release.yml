name: Build and Release Server

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore server/src/GamePadServer/GamePadServer.csproj

      - name: Build
        run: dotnet publish server/src/GamePadServer/GamePadServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./release

      - name: Zip release
        run: Compress-Archive -Path ./release/* -DestinationPath GamePadServer-${{ github.ref_name }}-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: GamePadServer-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
